name: Build Hybrid Player APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Hybrid Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Debug Keystore & Prepare Env
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Compute Auto-Incrementing Point Version (1.001, 1.002, ...)
        id: calc_version
        run: |
          BASE_PATCH=0
          if [ -f "version.properties" ]; then
            BASE_PATCH=$(grep -E '^VERSION_PATCH=' version.properties | cut -d'=' -f2 | tr -d '[:space:]' || echo 0)
          fi
          RUN_NUM=${{ github.run_number }}
          TOTAL_PATCH=$((BASE_PATCH + RUN_NUM))
          POINT_VER=$(printf "1.%03d" "$TOTAL_PATCH")
          VER_CODE=$((1000 + TOTAL_PATCH))
          echo "POINT_VER=$POINT_VER" >> "$GITHUB_ENV"
          echo "VER_CODE=$VER_CODE" >> "$GITHUB_ENV"
          echo "Generated APK Version: v$POINT_VER (versionCode=$VER_CODE)"

      - name: Build Debug APK with Auto Point Version
        run: |
          gradle :app:assembleDebug \
            -PautoVersionName="$POINT_VER" \
            -PautoVersionCode="$VER_CODE" \
            --no-daemon --stacktrace

      - name: Prepare Single Clean Versioned APK File for Download
        run: |
          rm -rf apk-output
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk "apk-output/Hybrid-Player-v${POINT_VER}.apk"
          ls -lh apk-output/

      - name: Upload Hybrid-Player-APK (Single APK in Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Hybrid-Player-APK-v${{ env.POINT_VER }}
          path: apk-output/Hybrid-Player-v${{ env.POINT_VER }}.apk
          if-no-files-found: error
          retention-days: 30
